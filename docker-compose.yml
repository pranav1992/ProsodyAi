services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoace
      POSTGRES_PASSWORD: autoace
      POSTGRES_DB: autoace
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://autoace:autoace@db:5432/autoace
      JWT_SECRET: local-dev-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLASSIFICATION_MODEL: gpt-4o-mini
      WHISPER_MODEL_SIZE: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      STORAGE_DIR: /app/storage
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autoace.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  backend_storage:
