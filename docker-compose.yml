services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoace}
      POSTGRES_DB: ${POSTGRES_DB:-autoace}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autoace}:${POSTGRES_PASSWORD:-autoace}@db:5432/${POSTGRES_DB:-autoace}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLASSIFICATION_MODEL: gpt-4o-mini
      WHISPER_MODEL_SIZE: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autoace.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  backend_storage:
