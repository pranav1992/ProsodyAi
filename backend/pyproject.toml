[project]
name = "autoace-backend"
version = "1.0.0"
description = "AutoAce voice tone & background noise analysis API"
requires-python = ">=3.11"
dependencies = [
    "setuptools<81",  # webrtcvad imports pkg_resources, removed in newer setuptools
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pydantic[email]==2.9.2",
    "python-multipart==0.0.9",
    "pyjwt==2.9.0",
    "bcrypt==4.2.0",
    "openai==1.51.0",
    "faster-whisper==1.0.3",
    "librosa==0.10.2",
    "soundfile==0.12.1",
    "webrtcvad==2.0.10",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]
notebook = [
    "ipykernel==6.29.5",
    "nbclient==0.10.0",
    "pandas==2.2.3",
    "matplotlib==3.9.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
