databases:
  - name: autoace-db
    plan: free
    databaseName: autoace
    user: autoace

services:
  - type: web
    name: autoace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CLASSIFICATION_MODEL
        value: gpt-4o-mini
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: STORAGE_DIR
        value: /app/storage
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://autoace-frontend.onrender.com
    disk:
      name: autoace-storage
      mountPath: /app/storage
      sizeGB: 5

  - type: web
    name: autoace-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerBuildArgs:
      NEXT_PUBLIC_API_URL: https://autoace-backend.onrender.com
    plan: starter
