# Reverse proxy in front of the backend (127.0.0.1:8000) and frontend
# (127.0.0.1:3000), which docker-compose binds to loopback only -- this is
# the single public entry point.
#
# Install: copy to /etc/nginx/sites-available/prosodyai.conf, symlink into
# sites-enabled, remove the default site, `nginx -t && systemctl reload nginx`.

# /batches/{id} is served by BOTH the backend (GET/DELETE /batches/{id} JSON
# API) and the frontend (the batch-detail React page lives at the identical
# path). A real browser navigating/refreshing there sends
# `Accept: text/html,...`; the frontend's own fetch() calls (built with
# NEXT_PUBLIC_API_URL pointed at this same host) don't. Route on that
# instead of guessing -- otherwise a page refresh or a shared/bookmarked
# batch link always hits the backend and shows a bare {"detail":"Not
# authenticated"} JSON blob instead of the dashboard.
map $http_accept $batches_detail_upstream {
    default                  "http://127.0.0.1:8000";
    "~*^text/html"           "http://127.0.0.1:3000";
}

server {
    listen 80 default_server;
    server_name _;

    # Must stay >= backend MAX_UPLOAD_MB (config.py, default 200) or nginx
    # rejects large batch-upload zips with 413 before FastAPI ever sees them.
    client_max_body_size 220m;
    client_body_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare /batches (list + upload) and /batches/{id}/download have no
    # competing frontend route -- always the backend.
    location = /batches {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/batches/[^/]+/download$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /batches/{id} exactly -- ambiguous, see the map{} above.
    location ~ ^/batches/[^/]+$ {
        proxy_pass $batches_detail_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
