# Reverse proxy in front of the backend (127.0.0.1:8000) and frontend
# (127.0.0.1:3000), which docker-compose binds to loopback only -- this is
# the single public entry point.
#
# Install: copy to /etc/nginx/sites-available/prosodyai.conf, symlink into
# sites-enabled, remove the default site, `nginx -t && systemctl reload nginx`.

server {
    listen 80 default_server;
    server_name _;

    # Must stay >= backend MAX_UPLOAD_MB (config.py, default 200) or nginx
    # rejects large batch-upload zips with 413 before FastAPI ever sees them.
    client_max_body_size 220m;
    client_body_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /batches {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
